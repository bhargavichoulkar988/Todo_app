<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <form action="/add"
              method="POST"
              class="task-form">

            <input
                type="text"
                name="title"
                placeholder="Enter a task..."
                required
            >

            <button type="submit">
                Add Task
            </button>

        </form>


        <div class="tasks">

            {% if tasks %}

                {% for task in tasks %}

                    <div class="task
                        {% if task['completed'] %}
                            completed
                        {% endif %}
                    ">

                        <span>
                            {{ task['title'] }}
                        </span>

                        <div class="actions">

                            <a href="/complete/{{ task['id'] }}"
                               class="complete">

                                {% if task['completed'] %}
                                    Undo
                                {% else %}
                                    Complete
                                {% endif %}

                            </a>

                            <a href="/delete/{{ task['id'] }}"
                               class="delete">

                                Delete

                            </a>

                        </div>

                    </div>

                {% endfor %}

            {% else %}

                <p class="empty">
                    No tasks yet. Add your first task!
                </p>

            {% endif %}

        </div>

    </div>

</body>

</html>
